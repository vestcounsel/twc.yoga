<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TWC closing slide</title>
<link href="../assets/fonts/montserrat.css" rel="stylesheet">
<style>
  :root{
    /* TWC palette (2026 refresh) */
    --words:#0b3954;     /* text, dark navy */
    --ground:#f5deb3;    /* primary light background, wheat */
    --identity:#aed6f1;  /* sky blue identity tone */
    --teal:#0077b6;      /* ocean blue accent, light surfaces */
    --sage:#aed6f1;      /* sky blue accent, dark surfaces */
    --deep:#0077b6;      /* ocean blue surface and accent */
    --coral:#ff6f61;     /* coral surface (legacy class bg-espresso) */
    --ml:88px;                 /* left and right margin */
    --asc:0.968; --em:1.219;   /* Montserrat metrics, do not edit */
  }
  body{ margin:0; background:#f3f3f1; }

  .slide{
    position:relative; width:1080px; height:1350px; overflow:hidden;
    font-family:'Montserrat',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .slide.bg-ground  { background:var(--ground);   color:var(--words);  --bg:var(--ground);   --accent:var(--teal);  --dot:rgba(0,119,182,.25);   }
  .slide.bg-haze    { background:var(--identity); color:var(--words);  --bg:var(--identity); --accent:var(--teal);  --dot:rgba(245,222,179,.6);  }
  .slide.bg-espresso{ background:var(--coral);    color:var(--words);  --bg:var(--coral);    --accent:var(--words); --dot:rgba(245,222,179,.45); }
  .slide.bg-deep    { background:var(--deep);     color:var(--ground); --bg:var(--deep);     --accent:var(--sage);  --dot:rgba(174,214,241,.4);  }

  /* Ambient identity: a soft dot field in the blue-grey identity tone,
     fading in from the lower right, clear of headline and wordmark. */
  .slide::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(var(--dot, rgba(157,179,191,.3)) 3px, transparent 3.5px);
    background-size:44px 44px; background-position:10px 10px;
    -webkit-mask-image:radial-gradient(640px 640px at 88% 74%, #000 0%, transparent 72%);
    mask-image:radial-gradient(640px 640px at 88% 74%, #000 0%, transparent 72%);
  }

  /* Baseline anchoring. .bl-top pins the first baseline, .bl-bot the last. */
  .bl-top,.bl-bot{
    position:absolute; left:var(--ml); right:var(--ml); margin:0;
    font-size:calc(var(--fs) * 1px); line-height:var(--lh);
    font-weight:700; white-space:pre;
  }
  .bl-top{ top:calc((var(--bl) - ((var(--lh) - var(--em))/2 + var(--asc)) * var(--fs)) * 1px); }
  .bl-bot{ bottom:calc((1350 - (var(--bl) + ((var(--lh) - var(--em))/2 + 0.251) * var(--fs))) * 1px); }

  .headline{ --fs:92.5; --lh:1.137; --bl:403.3; }
  .subheading{ --fs:36; --lh:1; --bl:478.9; letter-spacing:.076em;
             text-transform:uppercase; color:var(--accent); }

  /* Brand sign-off, pinned near the bottom margin. */
  .wordmark{ --fs:24; --lh:1; --bl:1224; letter-spacing:.105em;
             text-transform:uppercase; opacity:.68; }
</style>
</head>
<body>

<!-- =======================================================================
     EDIT HERE.
     Backgrounds:  bg-ground  bg-haze  bg-espresso  bg-deep
     Never indent a continuation line.
     ======================================================================= -->

<div class="slide {{BACKGROUND}}" data-template="closing" data-cta-key="{{CTA_KEY}}">

  <h1 class="bl-bot headline">{{CTA_HEADING}}</h1>

  <p class="bl-top subheading">{{CTA_SUBHEADING}}</p>

  <p class="bl-top wordmark">TWC · The Whole Concept</p>

</div>

<script>
/* Direct preview: if the {{...}} placeholders were never replaced,
   fall back to a sample CTA so the file still renders on its own.
   Tokens are split so the generator's replacement never touches them. */
(function(){
  const ph = name => '{{' + name + '}}';
  const slide = document.querySelector('.slide');
  const headline = document.querySelector('.headline');
  const subheading = document.querySelector('.subheading');
  if (slide.className.indexOf(ph('BACKGROUND')) !== -1) slide.className = 'slide bg-ground';
  if (slide.dataset.ctaKey === ph('CTA_KEY')) slide.dataset.ctaKey = 'begin';
  if (headline.textContent === ph('CTA_HEADING')) headline.textContent = 'Begin your\npractice';
  if (subheading.textContent === ph('CTA_SUBHEADING')) subheading.textContent = 'Book your first class';
  /* Injected copy may carry "\n" as two characters; turn them into real
     newlines so multiline headings keep working under white-space:pre. */
  for (const el of [headline, subheading]){
    if (el.textContent.indexOf('\\n') !== -1){
      el.textContent = el.textContent.split('\\n').join('\n');
    }
  }
})();

/* Auto-fit: shrinks a line only if it would cross the margin.
   Set lock to a number to force one fixed size on every slide. */
const FIT = [
  { sel:'.headline', max:92.5, min:60, lock:null },
  { sel:'.subheading', max:36, min:24, lock:null }
];

function widestLine(el, fs){
  const cs = getComputedStyle(el);
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;' +
    `font:${cs.fontWeight} ${fs}px Montserrat,sans-serif;` +
    `letter-spacing:${cs.letterSpacing};text-transform:${cs.textTransform};`;
  document.body.appendChild(probe);
  let w = 0;
  for (const line of el.textContent.split('\n')){
    probe.textContent = line;
    w = Math.max(w, probe.getBoundingClientRect().width);
  }
  probe.remove();
  return w;
}

document.fonts.ready.then(() => {
  for (const role of FIT){
    document.querySelectorAll(role.sel).forEach(el => {
      if (role.lock){ el.style.setProperty('--fs', role.lock); return; }
      const longest = widestLine(el, role.max);
      if (!longest) return;
      const fs = Math.min(role.max, role.max * el.clientWidth / longest);
      el.style.setProperty('--fs', Math.max(role.min, Math.floor(fs * 2) / 2));
    });
  }
});
</script>

</body>
</html>
