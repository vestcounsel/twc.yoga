<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TWC cover slide</title>
<link href="../assets/fonts/montserrat.css" rel="stylesheet">
<style>
  :root{
    /* TWC palette (2026 refresh) */
    --words:#0b3954;     /* text, dark navy */
    --ground:#f5deb3;    /* primary light background, wheat */
    --identity:#aed6f1;  /* sky blue identity tone */
    --teal:#0077b6;      /* ocean blue accent, light surfaces */
    --sage:#aed6f1;      /* sky blue accent, dark surfaces */
    --deep:#0077b6;      /* ocean blue surface and accent */
    --coral:#ff6f61;     /* coral surface (legacy class bg-espresso) */
    --ml:88px;                 /* left and right margin */
    --asc:0.968; --em:1.219;   /* Montserrat metrics, do not edit */
  }
  body{ margin:0; background:#f3f3f1; }

  .slide{
    position:relative; width:1080px; height:1350px; overflow:hidden;
    font-family:'Montserrat',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:var(--words); color:var(--ground);
  }
  .slide.bg-espresso{ background:var(--coral);    color:var(--words);  --dot:rgba(245,222,179,.45); }
  .slide.bg-deep    { background:var(--deep);     color:var(--ground); --dot:rgba(174,214,241,.4);  }
  .slide.bg-haze    { background:var(--identity); color:var(--words);  --dot:rgba(245,222,179,.6);  }
  .slide.bg-ground  { background:var(--ground);   color:var(--words);  --dot:rgba(0,119,182,.25);   }

  /* Ambient identity: a soft dot field in the blue-grey identity tone,
     fading out from the upper right so it never sits under the title. */
  .slide::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(var(--dot, rgba(157,179,191,.3)) 3px, transparent 3.5px);
    background-size:44px 44px; background-position:10px 10px;
    -webkit-mask-image:radial-gradient(760px 760px at 84% 16%, #000 0%, transparent 72%);
    mask-image:radial-gradient(760px 760px at 84% 16%, #000 0%, transparent 72%);
  }

  .bl-top,.bl-bot{
    position:absolute; left:var(--ml); right:var(--ml); margin:0;
    font-size:calc(var(--fs) * 1px); line-height:var(--lh);
    font-weight:700;
  }
  .bl-top{ top:calc((var(--bl) - ((var(--lh) - var(--em))/2 + var(--asc)) * var(--fs)) * 1px); }
  .bl-bot{ bottom:calc((1350 - (var(--bl) + ((var(--lh) - var(--em))/2 + 0.251) * var(--fs))) * 1px); }

  .wordmark{ --fs:48; --lh:1; --bl:166.2;
             letter-spacing:.105em; text-transform:uppercase;
             color:var(--sage); opacity:.85; }
  .slide.bg-ground .wordmark{ opacity:1; color:var(--teal); }
  .slide.bg-haze .wordmark  { opacity:1; color:var(--deep); }
  .slide.bg-espresso .wordmark{ opacity:1; color:var(--words); }

  /* pre-wrap keeps explicit returns AND wraps long titles naturally.
     The script below holds 120px whenever the title fits on up to
     three lines, and only then starts shrinking. */
  .display{ --fs:120; --lh:1.35; --bl:1263; letter-spacing:0; white-space:pre-wrap; }
</style>
</head>
<body>

<!-- =======================================================================
     EDIT HERE. Change the bg- class, change the headline text.
     Line breaks are literal: press return where you want the line to break.
     Backgrounds: bg-espresso  bg-deep  bg-haze  bg-ground
     ======================================================================= -->

<div class="slide {{BACKGROUND}}" data-template="cover">
  <p class="bl-top wordmark">The Whole Concept</p>
  <h1 class="bl-bot display">{{TITLE}}</h1>
</div>

<script>
/* Direct preview: if the {{...}} placeholders were never replaced,
   fall back to a sample cover so the file still renders on its own.
   Tokens are split so the generator's replacement never touches them. */
(function(){
  const ph = name => '{{' + name + '}}';
  const slide = document.querySelector('.slide');
  const title = document.querySelector('.display');
  if (slide.className.indexOf(ph('BACKGROUND')) !== -1) slide.className = 'slide bg-espresso';
  if (title.textContent === ph('TITLE')) title.textContent = 'The whole concept\nof yoga';
  /* Injected copy may carry "\n" as two characters; turn them into real
     newlines so multiline titles keep working under white-space:pre. */
  if (title.textContent.indexOf('\\n') !== -1){
    title.textContent = title.textContent.split('\\n').join('\n');
  }
})();

/* ---------------------------------------------------------------------
   Auto-fit. Titles hold 120px and wrap naturally onto up to three
   lines. The size drops only when the title would need a fourth line
   (or a single unbreakable word is wider than the margins), and never
   shrinks past MIN.

   Set LOCK to a number (e.g. LOCK = 116) to force every headline to one
   fixed size instead. Use that when you want a whole carousel to hold a
   single type size no matter what the copy is.
   --------------------------------------------------------------------- */
const MAX = 120, MIN = 72, LOCK = null, MAX_LINES = 3;

document.fonts.ready.then(() => {
  document.querySelectorAll('.display').forEach(el => {
    if (LOCK){ el.style.setProperty('--fs', LOCK); return; }
    const lh = 1.35;
    const fits = (fs) => {
      const lineCount = Math.round(el.clientHeight / (lh * fs));
      return lineCount <= MAX_LINES && el.scrollWidth <= el.clientWidth + 1;
    };
    let fs = MAX;
    el.style.setProperty('--fs', fs);
    while (fs > MIN && !fits(fs)){
      fs -= 0.5;
      el.style.setProperty('--fs', fs);
    }
  });
});
</script>

</body>
</html>
